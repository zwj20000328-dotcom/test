<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Infra 知识地图 · 知栈</title>
<meta name="description" content="AI Infra 的 31 个知识点，按硬件、单机优化、训练、推理、平台与前沿七个层级组织，标注前置关系。">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<script src="assets/js/theme-init.js"></script>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-nav="map">

<header id="siteNav"></header>

<main>
  <section class="pagehead">
    <div class="wrap">
      <div class="eyebrow">Track 01 · AI Infrastructure</div>
      <h1>AI Infra 知识地图</h1>
      <p>从一颗 GPU 到十万卡集群。31 个知识点按七层组织，卡片之间的细线是前置关系——沿着线走，就不会在某个术语上卡住。</p>
      <div class="stat-strip" id="trackStats"></div>
    </div>
  </section>

  <div class="toolbar">
    <div class="wrap toolbar__inner">
      <div class="chips" id="levelChips"></div>
      <div class="search-field">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-3.6-3.6"/></svg>
        <input id="mapSearch" type="search" placeholder="筛选条目或标签…" autocomplete="off">
      </div>
      <button class="chip" id="hideDone">只看未完成</button>
      <span class="toolbar__count" id="mapCount"></span>
    </div>
  </div>

  <section class="wrap">
    <div class="map" id="map">
      <svg class="map__edges" id="mapEdges" aria-hidden="true"></svg>
      <div id="levelList"></div>
    </div>
    <div style="display:flex;gap:20px;flex-wrap:wrap;font-size:12px;color:var(--muted);padding:8px 0 60px">
      <span>图例：</span>
      <span style="display:flex;align-items:center;gap:6px"><span style="width:22px;height:0;border-top:1.5px solid var(--line-strong)"></span>前置关系</span>
      <span style="display:flex;align-items:center;gap:6px"><span style="width:12px;height:12px;border-radius:50%;border:1.5px solid var(--line-strong)"></span>未学习</span>
      <span style="display:flex;align-items:center;gap:6px"><span style="width:12px;height:12px;border-radius:50%;background:var(--brand)"></span>已完成</span>
      <span style="margin-left:auto">点击卡片进入教程 · 阅读后可标记完成</span>
    </div>
  </section>
</main>

<footer id="siteFooter"></footer>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/track.js"></script>
</body>
</html>
